spring.application.name=equitrust

# Database (REQUERIDO: definir en variables de entorno)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:equitrust_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT (REQUERIDO: definir en variables de entorno)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=${SERVER_PORT:8080}

# CORS Configuration
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# WebSocket Configuration
websocket.allowed.origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# MongoDB Configuration (para Chat y otros documentos)
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/equitrust}
spring.data.mongodb.auto-index-creation=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# Logging
logging.level.org.springframework.security=${LOG_SECURITY_LEVEL:DEBUG}
logging.level.com.nocountry.equitrust=${LOG_APP_LEVEL:DEBUG}

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method