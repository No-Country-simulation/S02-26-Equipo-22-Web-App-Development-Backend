# ============================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ============================================
spring.application.name=equitrust
server.port=${PORT}

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS (H2 para desarrollo)
# ============================================
# Cambiar a PostgreSQL en producción
spring.datasource.url=jdbc:h2:mem:equitrust
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 (solo desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# CONFIGURACIÓN DE WEBSOCKET
# ============================================
# Múltiples orígenes separados por coma
websocket.allowed.origins=http://localhost:3000,http://localhost:5173

# ============================================
# CONFIGURACIÓN DE LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.nocountry=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.messaging=DEBUG

# ============================================
# CONFIGURACIÓN DE SEGURIDAD (temporal)
# ============================================
# Desactivar seguridad por defecto para desarrollo
spring.security.user.name=admin
spring.security.user.password=admin123

# ============================================
# CONFIGURACIÓN DE VALIDACIÓN
# ============================================
spring.validation.enabled=true
